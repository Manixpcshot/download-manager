name: Format report

# Temporary helper workflow: it runs rustfmt on a Linux runner, prints the resulting diff and
# pushes the formatted sources back to the same branch. It exists only so the redesign branch can
# be normalized without a local toolchain; it is removed again in a follow-up commit.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Apply formatting
        run: cargo fmt --all
      - name: Show formatting diff
        run: |
          git --no-pager diff --stat
          git --no-pager diff
      - name: Push formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Sources are already rustfmt clean."
            exit 0
          fi
          git add -A
          git commit -m "style: apply rustfmt to the redesign branch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
