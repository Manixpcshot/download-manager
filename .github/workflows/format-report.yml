name: Format report

# Temporary helper workflow. It runs rustfmt on a Linux runner and commits both the formatted
# sources and a plain-text report back to this branch, so the redesign can be normalized without a
# local toolchain. It is triggered only by touching the marker file below and is deleted again in a
# follow-up commit.

on:
  push:
    branches: ["arena/01a0da99-download-manager"]
    paths: [".github/format-report-trigger.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Build report
        continue-on-error: true
        run: |
          set +e
          {
            echo "## rustfmt report"
            echo "cargo fmt version: $(cargo fmt --version 2>&1)"
            echo "rustfmt version: $(rustfmt --version 2>&1)"
            echo
            echo "### cargo fmt --all -- --check"
            cargo fmt --all -- --check 2>&1
            echo "check exit: $?"
            echo
            echo "### cargo fmt --all"
            cargo fmt --all --verbose 2>&1
            echo "apply exit: $?"
          } > .github/fmt-report.txt
          cat .github/fmt-report.txt
      - name: Collect diff
        if: always()
        continue-on-error: true
        run: |
          set +e
          git add .github/fmt-report.txt
          {
            echo
            echo "### git diff --stat"
            git --no-pager diff --stat 2>&1
            echo
            echo "### git diff"
            git --no-pager diff 2>&1
          } >> .github/fmt-report.txt
          wc -c .github/fmt-report.txt
      - name: Push formatting changes
        if: always()
        continue-on-error: true
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "style: rustfmt report and formatted sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
