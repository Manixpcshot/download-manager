name: Windows CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all || echo "rustfmt reported issues; compiler checks below remain authoritative"
      - name: Check
        shell: pwsh
        run: |
          cargo check --all-targets 2>&1 | Tee-Object check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-log
          path: check.log
      - name: Report compiler failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('check.log') ? fs.readFileSync('check.log', 'utf8') : 'check.log was not created';
            const fence = '`'.repeat(3);
            const body = 'Windows compiler output for ' + context.sha + ':\n\n' + fence + 'text\n' + log.slice(-50000) + '\n' + fence;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || 1,
              body
            });
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: pulse-download-manager-windows-x64
          path: target/release/pulse-download-manager.exe
