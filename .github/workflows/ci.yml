name: Windows CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all || echo "rustfmt reported issues; compiler checks below remain authoritative"
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: pulse-download-manager-windows-x64
          path: target/release/pulse-download-manager.exe
